name: Code Gatekeeper CI/CD

on:
  push:
    branches:
      - test-branch

permissions:
  contents: write
  pull-requests: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run HTML validation
        run: npm test

      - name: Run JS validation (ESLint)
        run: |
          npx eslint "**/*.js" || exit 1

      - name: Run CSS validation (stylelint)
        run: |
          npx stylelint "**/*.css" || exit 1

  create-pr:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    outputs:
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: test-branch
          base: main
          title: "✅ Auto PR from test-branch"
          body: "This PR was automatically created after passing validations."

  auto-merge:
    runs-on: ubuntu-latest
    needs: create-pr
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-merge PR if it exists
        run: |
          PR_NUMBER=$(gh pr list --head test-branch --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "⚠️ No PR found. Skipping merge."
          else
            echo "✅ PR found: #$PR_NUMBER"
            gh pr merge $PR_NUMBER --squash --auto --repo ${{ github.repository }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: test
    if: failure()

    steps:
      - name: Notify Failure
        run: |
          echo "❌ CI FAILED: HTML/JS/CSS validation did not pass."
          echo "Check your files before pushing again."