name: Instructor Code Gatekeeper

on:
  push:
    branches:
      - 'dev'

jobs:
  test-and-auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Test
        run: npm test
      - name: Auto Merge to Main
        uses: fastify/github-action-merge-dependabot@v3 # Using a simpler merge action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: minor # This will help merge your dev pushes