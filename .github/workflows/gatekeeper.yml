name: Instructor Code Gatekeeper

on:
  pull_request:
    branches: [ "main" ] # Bantayan ang lahat ng PR na papasok sa main

jobs:
  test-and-gatekeep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Automatic Testing
        id: run_test
        run: npm test

      # 1. RESPONSE KAPAG NAG-FAIL (Instruction Requirement)
      - name: Automated Feedback on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ **Update Rejected!**\n\nHi Instructor! Ang inyong code ay hindi pumasa sa automatic testing. Pakicheck ang logs para sa error details. Hindi ito mai-me-merge sa main branch."
            })

      # 2. AUTOMATIC MERGE KAPAG VALID (Instruction Requirement)
      - name: Auto-merge to Main
        if: success()
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: "merge"
          MERGE_LABELS: "" # I-merge lahat basta passed
