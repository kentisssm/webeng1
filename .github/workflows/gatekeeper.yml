name: Instructor Code Gatekeeper

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-gatekeep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Automatic Testing
        id: run_test
        run: npm test

      # ITO YUNG AUTOMATIC RESPONSE KAPAG NAG-FAIL
      - name: Automated Feedback on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || context.payload.pull_request?.number || 0,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ **Update Rejected!**\n\nHi Instructor! Ang inyong commit ay hindi pumasa sa aming automatic testing. Pakicheck ang logs sa Actions tab para makita ang error sa `npm test`."
            })

      # AUTOMATIC MERGE KAPAG PASS
      - name: Auto-merge to Main
        if: success()
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: "merge"
          MERGE_LABELS: ""