name: Full Automation CI/CD

on:
  push:
    branches:
      - test-branch

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run HTML validation
        run: npm test

  create-pr:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    outputs:
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: test-branch
          base: main
          title: "✅ Auto PR (Passed Validation)"
          body: "This PR was automatically created after passing validation."

auto-merge:
  runs-on: ubuntu-latest
  needs: create-pr
  if: success()

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable Auto Merge
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        pull-request-number: ${{ needs.create-pr.outputs.pr_number }}
        merge-method: squash

  notify-failure:
    runs-on: ubuntu-latest
    needs: test
    if: failure()

    steps:
      - name: Notify Failure
        run: |
          echo "❌ VALIDATION FAILED"
          echo "Check your HTML files. HTMLHint detected errors."