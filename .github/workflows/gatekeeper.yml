- name: Automated Feedback on Failure
  if: failure()
  uses: actions/github-script@v7
  with:
    script: |
      const run_id = context.runId;
      const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;

      github.rest.repos.createCommitComment({
        owner: context.repo.owner,
        repo: context.repo.repo,
        commit_sha: context.sha,
        body: `❌ UPDATE REJECTED!

Check what went wrong here:
${link}

⚠️ The system detected errors in your code.`
      })