name: Instructor Code Gatekeeper

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # Kailangan para sa deployment
      id-token: write   # Kailangan para sa deployment
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # STEP 1: RUN YOUR LOGIC (The Gatekeeper)
      - name: Automatic Testing
        id: run_test
        run: npm test

      # STEP 2: FEEDBACK KAPAG MALI (Dito hihinto ang workflow kung exit 1)
      - name: Automated Feedback on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `❌ **UPDATE REJECTED!**\n\nHi Instructor! Ang inyong huling commit ay **HINDI PUMASA** sa automatic testing.\n\n🔍 **Error Details:** Pakicheck ang logs dito: [View Test Results](${link})\n\n⚠️ **Status:** Deployment Cancelled. Hindi nag-update ang live website.`
            })

      # STEP 3: DEPLOY LANG KAPAG SUCCESS (Hinding-hindi ito tatakbo kapag failed ang step 1)
      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: success()
        uses: actions/deploy-pages@v4