name: Instructor Code Gatekeeper

on:
  push:
    branches: [ "main" ]

jobs:
  validate-instructor-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Automatic Testing
        id: run_test
        run: npm test

      # AUTOMATIC RESPONSE KAPAG NAG-FAIL (Instruction Requirement)
      - name: Report Failure to Instructor
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: "❌ **UPDATE REJECTED!**\n\nHi Instructor! Ang inyong huling commit ay **HINDI PUMASA** sa automatic testing. Pakicheck ang logs sa Actions tab para sa detalye ng error.\n\n⚠️ *Note: This commit should be reverted or fixed to maintain website integrity.*"
            })

      # OPTIONAL: MESSAGE KAPAG SUCCESS
      - name: Report Success
        if: success()
        run: echo "Update Validated and Passed!"